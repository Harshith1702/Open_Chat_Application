<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTRP Real-Time Chat</title>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <link rel="stylesheet" href="/design.css" />
</head>

<body>
<div class="shell">
  <!-- LOBBY VIEW -->
  <div id="lobby-view" class="lobby-view">
    <div class="lobby-container">
      <div class="lobby-header">
        <h1>RTRP Chat Rooms</h1>
        <p class="lobby-subtitle">Join or create a room to start chatting</p>
      </div>

      <div class="lobby-actions">
        <button id="createRoomBtn" class="btn-primary">Create Room</button>
        <div class="search-box">
          <input type="text" id="searchRooms" placeholder="Search rooms..." aria-label="Search rooms" />
        </div>
      </div>

      <div class="rooms-grid" id="roomsList"></div>
    </div>
  </div>

  <!-- CREATE ROOM MODAL -->
  <div id="createRoomModal" class="modal">
    <div class="modal-content">
      <h2>Create New Room</h2>
      <button class="modal-close" id="closeCreateModal" aria-label="Close">✕</button>

      <div class="form-group">
        <label for="createUsername">Your Username</label>
        <input type="text" id="createUsername" placeholder="Enter your username" maxlength="20" />
      </div>

      <div class="form-group">
        <label for="newRoomName">Room Name</label>
        <input type="text" id="newRoomName" placeholder="Enter room name" maxlength="30" />
      </div>

      <div class="form-group">
        <label for="maxUsers">Max Users</label>
        <input type="number" id="maxUsers" value="10" min="2" max="100" />
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="isPrivate" />
        <label for="isPrivate">Private Room</label>
      </div>

      <div class="form-group" id="passwordGroup" style="display:none;">
        <label for="roomPassword">Password</label>
        <input type="password" id="roomPassword" placeholder="Enter password" />
      </div>

      <button id="confirmCreateRoom" class="btn-primary">Create Room</button>
    </div>
  </div>

  <!-- JOIN ROOM MODAL -->
  <div id="joinRoomModal" class="modal">
    <div class="modal-content">
      <h2>Join Room</h2>
      <button class="modal-close" id="closeJoinModal" aria-label="Close">✕</button>

      <div class="form-group">
        <label for="joinUsername">Username</label>
        <input type="text" id="joinUsername" placeholder="Enter your username" maxlength="20" />
      </div>

      <div class="form-group" id="joinPasswordGroup" style="display:none;">
        <label for="joinPassword">Password</label>
        <input type="password" id="joinPassword" placeholder="Enter room password" />
      </div>

      <button id="confirmJoinRoom" class="btn-primary">Join Room</button>
    </div>
  </div>

  <!-- CHAT VIEW -->
  <div id="chat-view" class="chat-view" style="display:none;">
    <aside class="sidebar">
      <div class="logo">RTRP</div>
    </aside>

    <main class="app">
      <header class="chat-header">
        <div class="header-text">
          <div class="title" id="roomTitle">Room Name</div>
          <div class="subtitle" id="roomSubtitle">Users: 0 / 10</div>
        </div>

        <div class="header-actions">
          <button id="infoBtn" aria-label="Room info" title="Room info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>
          <button id="clearChatBtn" aria-label="Clear chat" title="Clear chat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <button id="leaveRoomBtn" aria-label="Leave room" title="Leave room">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>

      <section id="chat-box" class="chat"></section>

      <div id="typingIndicator" class="typing-indicator" aria-live="polite"></div>

      <footer class="input-bar">
        <button id="emojiBtn" aria-label="Insert emoji" title="Insert emoji">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>
        <input id="message-input" placeholder="Type a message…" aria-label="Message" />
        <button id="send-btn" aria-label="Send" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </footer>
    </main>

    <aside class="info-panel" id="infoPanel">
      <button id="closeInfo" class="close-info" aria-label="Close room info">✕</button>
      <h3>Room Info</h3>
      <div id="roomInfo"></div>
    </aside>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/realtime.js"></script>

</body>
</html>
